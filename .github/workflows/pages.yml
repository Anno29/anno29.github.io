name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A61996: ${{ secrets.A61996 }}
          B0C328: ${{ secrets.B0C328 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A61996', '')
          tag_b = os.environ.get('B0C328', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- a71ef576544461fbba9219d180ca -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 161b5bc6620178f4490ce9b7a168302abeef11fa76d9 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
